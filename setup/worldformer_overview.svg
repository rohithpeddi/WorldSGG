<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" width="1240" height="910" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t   { fill:#0f172a; }
      .m   { fill:#64748b; }
      .mono{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1  { font-size:27px; font-weight:700; }
      .h2  { font-size:15px; font-weight:700; }
      .sub { font-size:14.5px; }
      .lbl { font-size:12px; font-weight:700; letter-spacing:.08em; }
      .bd  { font-size:13.5px; font-weight:600; }
      .bt  { font-size:12px; }
      .sm  { font-size:11px; }
      .xs  { font-size:10.5px; }
    </style>
  </defs>

  <rect width="1240" height="910" fill="#f8fafc"/>

  <!-- ══ header ══ -->
  <text class="t h1" x="40" y="46">WorldFormer</text>
  <text class="m sub" x="40" y="70">Geometric (π³) + semantic (DINOv3) foundation-model <tspan font-weight="700" fill="#0f172a">latents</tspan> for world scene graph generation — replacing the decoded perception stack.</text>

  <!-- ══ band 1: frozen front-end ══ -->
  <text class="m lbl" x="40" y="106">1 · FROZEN FRONT-END — CACHED ONCE, ANNOTATION-INDEPENDENT</text>

  <rect x="340" y="116" width="126" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t bd" x="403" y="145" text-anchor="middle">Video</text>
  <text class="m sm" x="403" y="163" text-anchor="middle">T annotated frames</text>
  <text class="m mono xs" x="403" y="179" text-anchor="middle">672 × 378 · patch 14</text>

  <path d="M470 152 H 512" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="518" y="116" width="212" height="33" rx="8" fill="#e6f7f4" stroke="#14b8a6"/>
  <text class="mono bd" x="530" y="132" fill="#0f766e">π³  (frozen)</text>
  <text class="m xs" x="530" y="144">decoder latents → geometry</text>

  <rect x="518" y="155" width="212" height="33" rx="8" fill="#f2ecfd" stroke="#8b5cf6"/>
  <text class="mono bd" x="530" y="171" fill="#6d28d9">DINOv3-L  (frozen)</text>
  <text class="m xs" x="530" y="183">patch tokens → semantics</text>

  <!-- fan-out to the two cache tiers -->
  <path d="M624 192 C 624 210, 330 196, 330 224" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <path d="M624 192 C 624 210, 910 196, 910 224" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>

  <!-- Tier 1 -->
  <rect x="60" y="230" width="540" height="92" rx="11" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="t h2" x="80" y="255">Tier-1 · ROI-pooled  <tspan class="m mono sm" font-weight="400">roi_align 7×7, mean</tspan></text>
  <text class="mono bt" x="80" y="277" fill="#0f766e">π³      F4 | F14 | G14        → 3072-d</text>
  <text class="mono bt" x="80" y="295" fill="#6d28d9">DINOv3  L16 | L20 | L24n      → 3072-d</text>
  <text class="m xs" x="80" y="313">per object + per person–object union box · boxes are annotation-independent</text>

  <!-- Tier 2 -->
  <rect x="640" y="230" width="540" height="92" rx="11" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="t h2" x="660" y="255">Tier-2 · full patch grids  <tspan class="m mono sm" font-weight="400">fp16</tspan></text>
  <text class="mono bt" x="660" y="277" fill="#0f766e">π³      F14, G14   (T, 27, 48, 1024)</text>
  <text class="mono bt" x="660" y="295" fill="#6d28d9">DINOv3  L16, L24n  (T, 24, 42, 1024)</text>
  <text class="m xs" x="660" y="313">both streams share π³ pixel space → a grid cell addresses the same pixels</text>

  <path d="M330 322 V 366" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M910 322 V 366" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- ══ band 2: C1 ══ -->
  <rect x="40" y="372" width="580" height="428" rx="14" fill="#fffdf6" stroke="#eadbb8"/>
  <text class="t h2" x="64" y="400">C1 · Token swap</text>
  <rect x="470" y="384" width="128" height="22" rx="11" fill="#166534"/>
  <text class="xs" x="534" y="399" text-anchor="middle" fill="#ffffff" font-weight="700">TRAINED · 6 CELLS</text>

  <rect x="64" y="416" width="532" height="52" rx="9" fill="#ffffff" stroke="#d6cfc0"/>
  <text class="t bd" x="80" y="437">ROI tokens</text>
  <text class="m mono sm" x="80" y="456">3072-d single stream   ·   6144-d fused</text>

  <path d="M330 468 V 490" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="64" y="496" width="532" height="92" rx="9" fill="#fff7e6" stroke="#f59e0b"/>
  <text class="t bd" x="80" y="517">Gated fusion projector</text>
  <text class="mono bt" x="80" y="538">hₖ = Linearₖ(xₖ)</text>
  <text class="mono bt" x="80" y="556">g  = softmaxₖ( W [h₁ ; h₂] )   ← per output dim</text>
  <text class="mono bt" x="80" y="574">h  = LayerNorm( ReLU( Σₖ gₖ ⊙ hₖ ) )</text>

  <path d="M330 588 V 610" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="64" y="616" width="532" height="96" rx="9" fill="#ffffff" stroke="#d6cfc0"/>
  <text class="t bd" x="80" y="637">WorldWise core — <tspan fill="#b45309">unchanged</tspan></text>
  <text class="m bt" x="80" y="657">geometry scaffold · MWAE masking (p = 0.3) · EMA recon target</text>
  <text class="m bt" x="80" y="675">associative retriever · relation head + pair geometry</text>
  <text class="m bt" x="80" y="693">temporal edge attention · τ = 0.5 logit adjustment</text>

  <path d="M330 712 V 734" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="64" y="740" width="532" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="t bd" x="80" y="767">World scene graph  <tspan class="m mono sm" font-weight="400">26 predicates × person–object pairs</tspan></text>

  <!-- ══ band 3: C2 ══ -->
  <rect x="620" y="372" width="580" height="428" rx="14" fill="#f7fbff" stroke="#d3e3f5"/>
  <text class="t h2" x="644" y="400">C2 · WorldFormer</text>
  <rect x="1078" y="384" width="98" height="22" rx="11" fill="#475569"/>
  <text class="xs" x="1127" y="399" text-anchor="middle" fill="#ffffff" font-weight="700">SCAFFOLD</text>

  <rect x="644" y="416" width="532" height="70" rx="9" fill="#ffffff" stroke="#c7dcf0"/>
  <text class="t bd" x="660" y="437">Grid fusion</text>
  <text class="m bt" x="660" y="456">crop padding · resample DINOv3 → π³ grid · per-cell softmax gate</text>
  <text class="mono sm" x="660" y="475" fill="#1d4ed8">memory (T, 1296, d) + 2-D sine positional encoding</text>

  <path d="M910 486 V 506" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="644" y="512" width="532" height="88" rx="9" fill="#eef6ff" stroke="#3b82f6"/>
  <text class="t bd" x="660" y="533">Queries</text>
  <text class="m bt" x="660" y="552">Q free DETR queries  →  detection</text>
  <text class="m bt" x="660" y="570">N persistent world slots  ←  geometry encoder over corners</text>
  <text class="bt" x="660" y="588" fill="#1d4ed8">invisible / masked slot → <tspan class="mono" font-weight="700">[MASK]</tspan> — MWAE at the query level</text>

  <path d="M910 600 V 620" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="644" y="626" width="532" height="70" rx="9" fill="#ffffff" stroke="#c7dcf0"/>
  <text class="t bd" x="660" y="647">Decoder × L</text>
  <text class="m bt" x="660" y="666">self-attention (weights kept) + cross-attention to memory</text>
  <text class="bt" x="660" y="685" fill="#1d4ed8">last self-attention map = EGTR relation by-product</text>

  <path d="M910 696 V 716" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="644" y="722" width="532" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="t bd" x="660" y="743">Joint heads</text>
  <text class="m bt" x="660" y="762">class (C+1) · 2D box · <tspan fill="#0f172a" font-weight="600">3D OBB</tspan> (factorised) · relations + connectivity · slot reconstruction</text>
  <text class="m xs" x="660" y="778">Hungarian matching + Hydra-SGG one-to-many assignment</text>

  <!-- ══ claim bar ══ -->
  <rect x="40" y="820" width="1160" height="62" rx="12" fill="#0f172a"/>
  <text class="xs" x="64" y="845" fill="#94a3b8" font-weight="700" letter-spacing=".08em">THE CLAIM BEING TESTED</text>
  <text class="bt" x="64" y="867" fill="#e2e8f0">C1 changes <tspan font-weight="700" fill="#ffffff">only the representation</tspan> — latents in place of the decoded FRCNN box-head 1024-d seam.</text>
  <text class="mono bt" x="700" y="845" fill="#94a3b8">predcls @20, last-frame, WorldBBox test (1,511 videos)</text>
  <text class="mono bt" x="700" y="867" fill="#e2e8f0">decoded 69.0 / 48.8   →   <tspan fill="#4ade80" font-weight="700">dinov3_tok 73.1 / 52.6</tspan>   (R / mR)</text>
</svg>
